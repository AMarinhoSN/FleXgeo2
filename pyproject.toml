[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "FleXgeo2"
version = "2.0.0.dev0"
description = "FleXgeo2 prototype for protein backbone differential geometry analysis using Melodia."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "biopython>=1.80",
    "hdbscan>=0.8",
    "melodia-py",
    "matplotlib>=3.8",
    "nglview>=4.0",
    "numba>=0.60",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[project.scripts]
flexgeo2 = "flexgeo2.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["flexgeo2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # Floating-point warnings raised from FleXgeo2 code are bugs, not noise.
    "error::RuntimeWarning:flexgeo2",
]

[tool.coverage.run]
# source_pkgs (not source) so "flexgeo2" is always the package, never a directory
# of that name in the working directory.
source_pkgs = ["flexgeo2"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Measured 95% (line + branch) when introduced; fail on a meaningful drop.
fail_under = 93

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "notebooks",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
